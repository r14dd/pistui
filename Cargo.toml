[package]
name = "pistui"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "Interactive UI for exploring Langfuse traces"
repository = "https://github.com/r14dd/pistui"
homepage = "https://github.com/r14dd/pistui"
documentation = "https://docs.rs/pistui"
authors = ["Riad Mukhtarov"]
readme = "README.md"
keywords = ["langfuse", "tracing", "llm", "observability"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".github/",
    "clippy.toml",
    "rustfmt.toml",
    "docs/",
    "examples/",
    "demo.tape",
    "demo.gif",
    "social-preview.png",
    "dist-workspace.toml",
]

[lib]
name = "pistui"
path = "src/lib.rs"

[[bin]]
name = "pistui"
path = "src/bin/pistui/main.rs"

[dependencies]
# CLI / runtime
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# HTTP + serialization
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
base64 = "0.22"

# Timestamps
chrono = { version = "0.4", default-features = false, features = ["serde"] }

# Errors
anyhow = "1"
thiserror = "2"

# Web server
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "set-header"] }
rust-embed = { version = "8", features = ["debug-embed"] }
mime_guess = "2"
open = "5"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }

[profile.dist]
inherits = "release"
lto = "thin"
